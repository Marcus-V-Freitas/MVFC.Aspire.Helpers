name: CI / Publish

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  ENABLE_CODECOV: ${{ secrets.CODECOV_TOKEN != '' && 'true' || 'false' }}

jobs:
  test-and-coverage:
    if: github.event_name != 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 e 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restaurar ferramentas .NET com versões fixadas
        run: dotnet tool restore

      - name: Executar Cake (build, testes e cobertura)
        run: dotnet tool run dotnet-cake -- build.cake

      - name: Resumo de cobertura
        if: always()
        shell: bash
        run: |
          if [[ -f CoverageReport/SummaryGithub.md ]]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura não foi produzido nesta execução." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comentário de cobertura no PR (PR interno)
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: CoverageReport/SummaryGithub.md

      - name: Enviar cobertura ao Codecov
        if: success() && env.ENABLE_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: true

  build-and-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirmar que a tag pertence à main
        shell: bash
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main || {
            echo "::error::A tag precisa apontar para um commit presente na main."
            exit 1
          }

      - name: Setup .NET 9 e 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restaurar ferramentas .NET com versões fixadas
        run: dotnet tool restore

      - name: Executar Cake (build, testes e cobertura)
        run: dotnet tool run dotnet-cake -- build.cake

      - name: Resumo de cobertura
        if: always()
        shell: bash
        run: |
          if [[ -f CoverageReport/SummaryGithub.md ]]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura não foi produzido nesta execução." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enviar cobertura ao Codecov
        if: success() && env.ENABLE_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: true

      - name: Empacotar binários já compilados
        shell: bash
        run: |
          mkdir -p nupkg
          while IFS= read -r -d '' csproj; do
            echo "Empacotando $csproj"
            dotnet pack "$csproj" \
              --configuration Release \
              --no-build --no-restore \
              --output ./nupkg
          done < <(find ./src -name '*.csproj' -print0 | sort -z)
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::Nenhum pacote NuGet foi gerado."
            exit 1
          fi
          echo "Pacotes gerados: ${#packages[@]}"
          ls -lah ./nupkg/

      - name: Login no NuGet.org por OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: marcuscosta

      - name: Publicar no NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::Nenhum .nupkg disponível para publicação."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publicar no GitHub Packages
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::Nenhum .nupkg disponível para publicação."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${REPOSITORY_OWNER}/index.json" \
              --api-key "$GH_PACKAGES_TOKEN" \
              --skip-duplicate
          done

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Criar GitHub Release (sem anexos)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## What's Changed
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
            ## Packages
            Published to [NuGet](https://www.nuget.org/profiles/marcuscosta).
