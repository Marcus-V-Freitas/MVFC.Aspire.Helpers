name: CI / Publish

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  ENABLE_CODECOV: ${{ secrets.CODECOV_TOKEN != '' && 'true' || 'false' }}

jobs:
  check-main-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_test: ${{ steps.check.outputs.should_test }}
    steps:
      - name: Verificar se o commit veio de um PR integrado
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Na dúvida, executa os testes; nunca ignora um push por erro da API.
          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/associated-prs.json"; then
            echo "::warning::Não foi possível consultar PRs associados. Executando testes por segurança."
            echo "should_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if jq -e --arg sha "$GITHUB_SHA" \
            'any(.[]; .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)' \
            "$RUNNER_TEMP/associated-prs.json" > /dev/null; then
            echo "Commit criado por merge de PR: testes já executados no PR."
            echo "should_test=false" >> "$GITHUB_OUTPUT"
          else
            echo "Push direto na main: executando testes."
            echo "should_test=true" >> "$GITHUB_OUTPUT"
          fi

  test-and-coverage:
    needs: check-main-push
    if: >-
      !cancelled() &&
      (
        github.event_name == 'pull_request' ||
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.check-main-push.outputs.should_test == 'true'
        )
      )
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 e 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restaurar ferramentas .NET com versões fixadas
        run: dotnet tool restore

      - name: Executar Cake (build, testes e cobertura)
        run: dotnet tool run dotnet-cake -- build.cake

      - name: Resumo de cobertura
        if: always()
        shell: bash
        run: |
          if [[ -f CoverageReport/SummaryGithub.md ]]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura não foi produzido nesta execução." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comentário de cobertura no PR (PR interno)
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: CoverageReport/SummaryGithub.md

      - name: Enviar cobertura ao Codecov
        if: success() && env.ENABLE_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: true

  build-and-publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9 e 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restaurar ferramentas .NET com versões fixadas
        run: dotnet tool restore

      - name: Executar Cake (build, testes e cobertura)
        run: dotnet tool run dotnet-cake -- build.cake

      - name: Resumo de cobertura
        if: always()
        shell: bash
        run: |
          if [[ -f CoverageReport/SummaryGithub.md ]]; then
            cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Relatório de cobertura não foi produzido nesta execução." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Enviar cobertura ao Codecov
        if: success() && env.ENABLE_CODECOV == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: integration
          fail_ci_if_error: true

      - name: Empacotar binários já compilados
        shell: bash
        run: |
          mkdir -p nupkg
          while IFS= read -r -d '' csproj; do
            echo "Empacotando $csproj"
            dotnet pack "$csproj" \
              --configuration Release \
              --no-build --no-restore \
              --output ./nupkg
          done < <(find ./src -name '*.csproj' -print0 | sort -z)
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::Nenhum pacote NuGet foi gerado."
            exit 1
          fi
          echo "Pacotes gerados: ${#packages[@]}"
          ls -lah ./nupkg/

      - name: Login no NuGet.org por OIDC
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: marcuscosta

      - name: Publicar no NuGet.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::Nenhum .nupkg disponível para publicação."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publicar no GitHub Packages
        shell: bash
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          shopt -s nullglob
          packages=(./nupkg/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::Nenhum .nupkg disponível para publicação."
            exit 1
          fi
          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --source "https://nuget.pkg.github.com/${REPOSITORY_OWNER}/index.json" \
              --api-key "$GH_PACKAGES_TOKEN" \
              --skip-duplicate
          done

  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Criar GitHub Release (sem anexos)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## What's Changed
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.
            ## Packages
            Published to [NuGet](https://www.nuget.org/profiles/marcuscosta).
